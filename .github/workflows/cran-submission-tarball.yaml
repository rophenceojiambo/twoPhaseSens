name: Build CRAN submission tarball

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tarball:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check

      - name: Build CRAN submission source package
        run: |
          R CMD build .
          test -f twoPhaseSens_0.1.0.tar.gz
          sha256sum twoPhaseSens_0.1.0.tar.gz

      - name: Upload CRAN submission tarball
        uses: actions/upload-artifact@v4
        with:
          name: twoPhaseSens-0.1.0-cran-submission
          path: twoPhaseSens_0.1.0.tar.gz
          if-no-files-found: error
